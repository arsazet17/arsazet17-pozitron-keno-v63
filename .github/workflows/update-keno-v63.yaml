name: KENO v6.3 · Stoloto MAIN

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Для тиражей важен самый свежий запуск. Старый зависший запуск не должен
# держать очередь и блокировать новый факт.
concurrency:
  group: keno-v63-stoloto-auto
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить файлы KENO 6.3
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fresh main
        run: |
          git fetch origin main --prune
          git reset --hard origin/main

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Как в рабочем M5M: Chromium кэшируется, а не скачивается заново
      # для каждого тиража.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.54.0-chromium

      - name: Playwright
        run: |
          npm install --no-save playwright@1.54.0
          npx playwright install --with-deps chromium

      - name: Проверить серверный код
        run: |
          node --check engine-v63.js
          node --check scripts/fingerprint-server-v63.js
          node --check scripts/stoloto-keno-update-v63-fast.mjs
          node --check scripts/prepare-v63-client-stoloto.mjs
          node --check scripts/validate-v63-server.js
          node --check scripts/test-server-learning-v63.js

      - name: FINGERPRINT self-test
        run: node scripts/test-server-learning-v63.js

      # ВАЖНО: один быстрый цикл, как в M5M.
      # Сам reader делает три коротких чтения последних 10 тиражей и
      # принимает 2-of-3 consensus. Никакого 6-кратного 150-строчного цикла.
      - name: Столото OAuth · M5M-style recent tail
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node scripts/stoloto-keno-update-v63-fast.mjs

      - name: Проверить SERVER state
        run: node scripts/validate-v63-server.js

      - name: Перевести клиент 6.3 на локальную историю
        run: node scripts/prepare-v63-client-stoloto.mjs

      - name: Проверить клиентский JS после патча
        run: |
          node --check app-v63.js
          node --check storage-v63.js
          node --check sync-v63-client.js
          node --check sw.js
          if grep -E "lucky-numbers|keno-history-v62|pozitron-keno-v5" app-v63.js sync-v63-client.js sw.js; then
            echo "FAIL: старый источник найден в активном клиентском коде"
            exit 1
          fi

      - name: Сохранить подтверждённое обновление
        shell: bash
        run: |
          FILES="keno-history-v63.json keno-status-v63.json fingerprint-state-v63.json fingerprint-archive-v63.json app-v63.js storage-v63.js sync-v63-client.js sw.js index.html"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "KENO v6.3 · M5M-style Stoloto refresh"
          git fetch origin main --prune
          git rebase origin/main
          git push origin HEAD:main
