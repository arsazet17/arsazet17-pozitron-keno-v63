name: KENO v6.3 Server Learning

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: update-keno-v63
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check engine-v63.js
          node --check scripts/fingerprint-server-v63.js
          node --check scripts/keno-update-v63.js
          node --check scripts/validate-v63-server.js
          node --check scripts/test-server-learning-v63.js

      - name: Server learning self-test
        run: node scripts/test-server-learning-v63.js

      - name: Update draws + settle + learn + forecast
        run: node scripts/keno-update-v63.js

      - name: Validate server state
        run: node scripts/validate-v63-server.js

      - name: Commit server data
        shell: bash
        run: |
          FILES="keno-history-v63.json keno-status-v63.json fingerprint-state-v63.json fingerprint-archive-v63.json"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No server data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "KENO v6.3 server learn and forecast"
          git push
