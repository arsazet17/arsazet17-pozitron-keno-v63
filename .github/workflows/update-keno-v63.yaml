name: KENO v6.3 Server Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: update-keno-v63
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update KENO v6.3 server history
        run: node scripts/keno-update-v63.js

      - name: Commit updated KENO v6.3 data
        shell: bash
        run: |
          if git diff --quiet -- keno-history-v63.json keno-status-v63.json; then
            echo "No new KENO draw data."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keno-history-v63.json keno-status-v63.json
          git commit -m "Auto-update KENO v6.3 server data"
          git push
