name: IRIS 1.2 · LAST 100 BACKTEST

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iris-engine-v63.js'
      - 'scripts/backtest-iris-natural-v63.js'
      - '.github/workflows/backtest-iris-natural-v63.yaml'

permissions:
  contents: write

concurrency:
  group: iris-natural-backtest-v63
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверить код IRIS
        run: |
          node --check iris-engine-v63.js
          node --check scripts/backtest-iris-natural-v63.js
          node scripts/test-iris-v63.js

      - name: Walk-forward последних 100 тиражей
        run: node scripts/backtest-iris-natural-v63.js

      - name: Сохранить исследовательский отчёт
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iris-natural-backtest-last100-v63.json IRIS_NATURAL_BACKTEST_LAST100.md
          if git diff --cached --quiet; then
            echo "Отчёт не изменился"
            exit 0
          fi
          git commit -m "[research] IRIS 1.2 last-100 natural-size backtest"
          git pull --rebase origin main
          git push origin HEAD:main
